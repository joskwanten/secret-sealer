# Publish a release by changing VERSION on main (no tag push needed):
#
#   echo v1.1.0 > VERSION && git commit -am "Release v1.1.0" && git push
#
# Pushing a v* tag works too. The workflow builds the binaries for Windows, macOS and Linux,
# attaches them to a GitHub Release (creating the tag) and points the Scoop manifest
# (bucket/secret-sealer.json) at the new version.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(tr -d '[:space:]' < VERSION)"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Ongeldige versie '$tag' (verwacht bijv. v1.2.3)"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag bestaat al; niets te doen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: |
          node --test "test/*.test.js"
          go test ./...

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: scripts/build-release.sh "${{ steps.version.outputs.tag }}"

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Secret Sealer $TAG" \
            --generate-notes

      - name: Update Scoop manifest on main
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          scripts/update-scoop-manifest.sh "$TAG" dist/checksums.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/secret-sealer.json
          git commit -m "Scoop: secret-sealer $TAG"
          git push origin main
