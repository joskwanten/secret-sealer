# Push a tag to publish a release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Builds the binaries for Windows, macOS and Linux, attaches them to a GitHub Release
# and points the Scoop manifest (bucket/secret-sealer.json) at the new version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: |
          node --test "test/*.test.js"
          go test ./...

      - name: Build
        run: scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Secret Sealer $GITHUB_REF_NAME" \
            --generate-notes

      - name: Update Scoop manifest on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          scripts/update-scoop-manifest.sh "$GITHUB_REF_NAME" dist/checksums.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/secret-sealer.json
          git commit -m "Scoop: secret-sealer $GITHUB_REF_NAME"
          git push origin main
